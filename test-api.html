<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Testing Backend API</h1>
    <button onclick="testHealth()">Test /actuator/health</button>
    <button onclick="testPrometheus()">Test /actuator/prometheus</button>
    <button onclick="testHello()">Test /api/hello</button>
    <pre id="result"></pre>

    <script>
        async function testHealth() {
            try {
                const response = await fetch('http://localhost:8082/actuator/health');
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }

        async function testPrometheus() {
            try {
                const response = await fetch('http://localhost:8082/actuator/prometheus');
                const data = await response.text();
                document.getElementById('result').textContent = data.substring(0, 500) + '...';
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }

        async function testHello() {
            try {
                const response = await fetch('http://localhost:8082/api/hello');
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
