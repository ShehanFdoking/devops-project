services:
  # Backend Service
  - type: web
    name: devops-springboot-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: 8082
      - key: SPRING_PROFILES_ACTIVE
        value: production
    autoDeploy: true

  # Frontend Service (if you want to deploy separately)
  - type: web
    name: devops-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        value: https://devops-springboot-app.onrender.com
    autoDeploy: true
