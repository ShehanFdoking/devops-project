apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-springboot-app
  namespace: default
  labels:
    app: devops-springboot-app
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-springboot-app
  template:
    metadata:
      labels:
        app: devops-springboot-app
        version: v1
    spec:
      containers:
      - name: devops-springboot-app
        image: 852093845150.dkr.ecr.eu-north-1.amazonaws.com/devops-springboot-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SERVER_PORT
          value: "8082"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: devops-springboot-app-service
  labels:
    app: devops-springboot-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/actuator/health"
spec:
  type: LoadBalancer
  selector:
    app: devops-springboot-app
  ports:
  - name: http
    port: 80
    targetPort: 8082
    protocol: TCP
  sessionAffinity: None
